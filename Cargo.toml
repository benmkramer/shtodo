[package]
name = "shtodo"
version = "0.1.0"
description = "A blazing fast, fully local TUI based todo app."
authors = ["Ben Kramer <benmkramer@gmail.com>"]
license = "MIT"
edition = "2024"
rust-version = "1.89"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
color-eyre = "0.6.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.0"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
